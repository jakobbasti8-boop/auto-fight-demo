name: Import Dr BOB HD assets
on:
  push:
    branches: ["improve/bob-hd-kame-20260906"]
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/bob-hd-kame-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy
      - name: Download source atlases
        run: |
          curl -L --fail -o /tmp/bob-base.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IsCcBrkHCdjBKopIOKqeEP9WrB/ee3a8486-a69e-43cf-aee7-bccdc032b831.png'
          curl -L --fail -o /tmp/bob-kame.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IsCcBrkHCdjBKopIOKqeEP9WrB/009c0315-d12a-462d-83db-cc9741c34a74.png'
          curl -L --fail -o /tmp/bob-beam.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IsCcBrkHCdjBKopIOKqeEP9WrB/b7aa35cd-92a2-4a4b-abe3-e8e34f406316.png'
      - name: Cut, anchor and encode production atlases
        run: |
          python <<'PY'
          from PIL import Image,ImageFilter
          import numpy as np
          from pathlib import Path

          def clean(im):
              im=im.convert('RGBA'); a=np.array(im).copy(); al=a[:,:,3].astype(np.float32)
              lo,hi=10.0,238.0
              na=np.clip((al-lo)/(hi-lo)*255.0,0,255)
              na[al<lo]=0; na[al>hi]=255
              a[:,:,3]=na.astype(np.uint8); a[a[:,:,3]==0,:3]=0
              return Image.fromarray(a,'RGBA')

          def foot_anchor(cell):
              a=np.array(cell.convert('RGBA')); alpha=a[:,:,3]; rgb=a[:,:,:3]; h,w=alpha.shape
              yy,xx=np.indices((h,w)); dark=(alpha>90)&(rgb.max(axis=2)<105)&(yy>h*.58)
              ys,xs=np.where(dark)
              if len(ys)<10: ys,xs=np.where((alpha>50)&(yy>h*.65))
              if not len(ys): return w/2,h*.94
              my=ys.max(); keep=ys>my-h*.16
              if keep.sum()>=5: ys,xs=ys[keep],xs[keep]
              return float(np.median(xs)),float(my)

          def atlas(src_path,dst_path,anchor_rows=None,anchor_all=False):
              src=clean(Image.open(src_path)); sw,sh=src.size
              out=Image.new('RGBA',(2560,2560),(0,0,0,0))
              for r in range(5):
                  for c in range(5):
                      x0=round(c*sw/5); x1=round((c+1)*sw/5); y0=round(r*sh/5); y1=round((r+1)*sh/5)
                      cell=src.crop((x0,y0,x1,y1)).resize((480,480),Image.Resampling.LANCZOS)
                      alpha=cell.getchannel('A')
                      rgb=Image.new('RGB',cell.size); rgb.paste(cell,mask=alpha)
                      rgb=rgb.filter(ImageFilter.UnsharpMask(radius=.8,percent=115,threshold=3))
                      cell=Image.merge('RGBA',(*rgb.split(),alpha))
                      x=y=16
                      if anchor_all or (anchor_rows is not None and r in anchor_rows):
                          fx,fy=foot_anchor(cell); x=round(256-fx); y=round(492-fy)
                          aa=np.array(cell)[:,:,3]; yy,xx=np.where(aa>8)
                          if len(xx):
                              x=max(8-int(xx.min()),min(x,503-int(xx.max())))
                              y=max(8-int(yy.min()),min(y,503-int(yy.max())))
                      frame=Image.new('RGBA',(512,512),(0,0,0,0)); frame.alpha_composite(cell,(int(x),int(y)))
                      out.alpha_composite(frame,(c*512,r*512))
              out.save(dst_path,'WEBP',lossless=True,quality=100,method=6)

          Path('assets').mkdir(exist_ok=True)
          atlas('/tmp/bob-base.png','assets/bob.webp',anchor_rows={0,1,2,3})
          atlas('/tmp/bob-kame.png','assets/kame.webp',anchor_all=True)

          src=clean(Image.open('/tmp/bob-beam.png')); ar=np.array(src); col=(ar[:,:,3]>10).sum(axis=0)
          low=col<3; runs=[]; s=None
          for i,v in enumerate(low):
              if v and s is None: s=i
              elif not v and s is not None:
                  if i-s>=8: runs.append((s,i))
                  s=None
          if s is not None and len(low)-s>=8: runs.append((s,len(low)))
          parts=[]
          for i in range(len(runs)-1):
              x0,x1=runs[i][1],runs[i+1][0]
              if x1-x0>50: parts.append((x0,x1))
          if len(parts)!=5: raise RuntimeError(f'Expected 5 beam modules, got {parts}')
          out=Image.new('RGBA',(2560,512),(0,0,0,0)); common_y=1.19
          for i,(x0,x1) in enumerate(parts):
              sub=src.crop((x0,0,x1,src.height)); aa=np.array(sub)[:,:,3]; ys,xs=np.where(aa>10)
              crop=sub.crop((int(xs.min()),int(ys.min()),int(xs.max()+1),int(ys.max()+1)))
              if i<4:
                  nh=round(crop.height*common_y)
                  if nh>504: nh=504
                  resized=crop.resize((512,nh),Image.Resampling.LANCZOS)
                  out.alpha_composite(resized,(i*512,(512-nh)//2))
              else:
                  sc=min(496/crop.width,496/crop.height); nw,nh=round(crop.width*sc),round(crop.height*sc)
                  resized=crop.resize((nw,nh),Image.Resampling.LANCZOS)
                  out.alpha_composite(resized,(i*512+(512-nw)//2,(512-nh)//2))
          out.save('assets/kame-beam.webp','WEBP',lossless=True,quality=100,method=6)
          for p in ['assets/bob.webp','assets/kame.webp','assets/kame-beam.webp']:
              im=Image.open(p); print(p,im.size,im.mode,Path(p).stat().st_size)
          PY
      - name: Commit production assets and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-bob-hd.yml
          git add assets/bob.webp assets/kame.webp assets/kame-beam.webp .github/workflows/import-bob-hd.yml
          git commit -m "Replace Dr. BOB with HD base, Kamehameha and modular beam atlases"
          git push origin HEAD:improve/bob-hd-kame-20260906
