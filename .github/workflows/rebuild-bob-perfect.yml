name: Rebuild Dr BOB perfect atlas
on:
  push:
    branches: ["improve/bob-perfect-animation-20260906"]
permissions:
  contents: write
jobs:
  rebuild-bob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/bob-perfect-animation-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy
      - name: Download exact normal-animation source sheet
        run: curl -L --fail -o /tmp/bob-normal.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IsCcBrkHCdjBKopIOKqeEP9WrB/9fd3adae-fffb-4127-8241-12a66b441cb9.png'
      - name: Cut 25 cells and remove green/grid background
        run: |
          python <<'PY'
          from PIL import Image,ImageFilter
          import numpy as np
          from collections import deque
          from pathlib import Path

          src=Image.open('/tmp/bob-normal.png').convert('RGB')
          W,H=src.size
          assert (W,H)==(1536,1536), (W,H)

          def strip_background(im):
              rgb=np.array(im.convert('RGB'))
              h,w=rgb.shape[:2]
              R,G,B=rgb[:,:,0],rgb[:,:,1],rgb[:,:,2]
              delta=G.astype(np.int16)-np.maximum(R,B).astype(np.int16)
              # Background candidates: chroma green plus the white raster. Flooding only
              # from cell borders protects the white coat inside the outlined character.
              green=(G>112)&(delta>15)
              spread=rgb.max(axis=2).astype(np.int16)-rgb.min(axis=2).astype(np.int16)
              white=(R>220)&(G>220)&(B>220)&(spread<24)
              cand=green|white
              seen=np.zeros((h,w),dtype=np.uint8)
              q=deque()
              def seed(y,x):
                  if cand[y,x] and not seen[y,x]: seen[y,x]=1; q.append((y,x))
              for x in range(w): seed(0,x); seed(h-1,x)
              for y in range(h): seed(y,0); seed(y,w-1)
              while q:
                  y,x=q.popleft()
                  if y: seed(y-1,x)
                  if y<h-1: seed(y+1,x)
                  if x: seed(y,x-1)
                  if x<w-1: seed(y,x+1)
              alpha=np.where(seen,0,255).astype(np.uint8)
              # Remove residual green spill on antialiased edge pixels without touching
              # opaque character colors.
              edge=(alpha>0)&(G>R+8)&(G>B+8)
              rgb2=rgb.copy()
              rgb2[:,:,1][edge]=np.minimum(rgb2[:,:,1][edge],np.maximum(rgb2[:,:,0][edge],rgb2[:,:,2][edge])+8)
              rgba=np.dstack((rgb2,alpha))
              rgba[alpha==0,:3]=0
              return Image.fromarray(rgba,'RGBA')

          out=Image.new('RGBA',(2560,2560),(0,0,0,0))
          report=[]
          for row in range(5):
              for col in range(5):
                  # The supplied sheet is an exact 5x5 raster. Inset 10 px removes the
                  # white divider completely while retaining all character pixels.
                  x0=round(col*W/5)+10; x1=round((col+1)*W/5)-10
                  y0=round(row*H/5)+10; y1=round((row+1)*H/5)-10
                  cell=strip_background(src.crop((x0,y0,x1,y1)))
                  cell=cell.resize((480,480),Image.Resampling.LANCZOS)
                  frame=Image.new('RGBA',(512,512),(0,0,0,0))
                  frame.alpha_composite(cell,(16,16))
                  aa=np.array(frame.getchannel('A'))
                  ys,xs=np.where(aa>8)
                  if len(xs):
                      margins=(int(xs.min()),int(ys.min()),int(511-xs.max()),int(511-ys.max()))
                      if min(margins)<6:
                          raise RuntimeError(f'frame {row},{col} margin too small: {margins}')
                      report.append((row,col,margins))
                  out.alpha_composite(frame,(col*512,row*512))
          out.save('assets/bob.webp','WEBP',lossless=True,quality=100,method=6)
          print('assets/bob.webp',out.size,Path('assets/bob.webp').stat().st_size)
          print('minimum margin',min(min(m[2]) for m in report))
          PY
      - name: Commit production atlas and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebuild-bob-perfect.yml
          git add assets/bob.webp .github/workflows/rebuild-bob-perfect.yml
          git commit -m "Rebuild Dr. BOB normal atlas from exact 25-frame sheet"
          git push origin HEAD:improve/bob-perfect-animation-20260906
