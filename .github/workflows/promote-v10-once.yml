name: Promote verified v10 package once

on:
  push:
    paths:
      - '.github/workflows/promote-v10-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified package into source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile

          repo = Path.cwd()
          archive = repo / '444444444444444_3.zip'
          if not archive.exists():
              raise SystemExit(f'missing {archive.name}')

          temp = repo / '.v10-extract'
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'corrupt ZIP entry: {bad}')
              zf.extractall(temp)

          package = temp / 'auto-fight-demo'
          if not package.is_dir():
              raise SystemExit('expected auto-fight-demo/ root in ZIP')

          # Promote runtime, production assets and reproducible recut pipeline.
          root_files = [
              'index.html', 'styles.css',
              'game-catalog.js', 'game-boot.js', 'game-moves.js',
              'game-fighter.js', 'game-director.js', 'game-render.js',
              'game-brainbug.js', 'game-specials.js', 'game-bob-hd.js',
          ]
          for name in root_files:
              src = package / name
              if not src.is_file():
                  raise SystemExit(f'missing package file: {name}')
              shutil.copy2(src, repo / name)

          assets = package / 'assets'
          if not assets.is_dir():
              raise SystemExit('missing package assets/')
          (repo / 'assets').mkdir(exist_ok=True)
          for src in assets.iterdir():
              if src.is_file():
                  shutil.copy2(src, repo / 'assets' / src.name)

          tools = package / 'tools'
          if not tools.is_dir():
              raise SystemExit('missing package tools/')
          for src in tools.rglob('*'):
              rel = src.relative_to(tools)
              if '__pycache__' in rel.parts or src.suffix == '.pyc':
                  continue
              dst = repo / 'tools' / rel
              if src.is_dir():
                  dst.mkdir(parents=True, exist_ok=True)
              else:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

          # Remove superseded split-row/legacy production assets. Their raw source
          # remains available under tools/source where relevant.
          legacy = [
              'assets/nova.webp',
              'assets/brainbug-sourmilk-special.webp',
          ]
          for pattern in ('assets/theresa-proton-row-*.webp', 'assets/kurz-comet-row-*.webp'):
              legacy.extend(str(p.relative_to(repo)) for p in repo.glob(pattern))
          for name in legacy:
              p = repo / name
              if p.exists():
                  p.unlink()

          shutil.rmtree(temp)
          PY

      - name: Validate promoted source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t 444444444444444_3.zip >/dev/null
          for f in assets/catalog.js game-catalog.js game-boot.js game-moves.js game-fighter.js game-director.js game-render.js game-brainbug.js game-specials.js game-bob-hd.js; do
            node --check "$f"
          done
          python -m py_compile tools/recut.py tools/spritekit.py
          rm -rf tools/__pycache__
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path.cwd()
          catalog = json.loads((root/'assets/catalog.json').read_text(encoding='utf-8'))
          missing = [v['file'] for v in catalog.values() if not (root/'assets'/v['file']).exists()]
          if missing:
              raise SystemExit('catalog assets missing: ' + ', '.join(missing))

          html = (root/'index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="([^"]+)"', html)
          local = [r for r in refs if not r.startswith(('http://','https://','#'))]
          absent = [r for r in local if not (root/r).exists()]
          if absent:
              raise SystemExit('index references missing: ' + ', '.join(absent))

          expected = {'bob','kame','kame-beam','kurz','kurz-comet','theresa','theresa-proton','brainbug','brainbug-sourmilk','brainbug-sourmilk-beam'}
          if set(catalog) != expected:
              raise SystemExit(f'unexpected catalog keys: {sorted(catalog)}')
          print('v10 validation OK:', len(catalog), 'catalog entries')
          PY

      - name: Commit promoted v10 and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-v10-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: promote verified v10 catalog pipeline from HD package'
          git push origin HEAD:main
